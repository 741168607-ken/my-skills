<svg viewBox="0 0 1200 820" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="pg" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#6fbf3f"/>
      <rect width="20" height="7" fill="#86d24e"/>
      <rect x="0" y="0" width="10" height="3" fill="#9ae061" opacity=".85"/>
      <rect x="13" y="10" width="7" height="5" fill="#63ad36" opacity=".55"/>
    </pattern>
    <pattern id="pd" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#8a5a2e"/>
      <rect x="3" y="4" width="7" height="6" fill="#7a4d26"/>
      <rect x="12" y="12" width="6" height="6" fill="#9c6837"/>
      <rect x="1" y="14" width="4" height="4" fill="#6d4322" opacity=".7"/>
    </pattern>
    <pattern id="ps" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#9a9a96"/>
      <rect x="2" y="2" width="8" height="7" fill="#8b8b87"/>
      <rect x="12" y="11" width="7" height="7" fill="#a8a8a3"/>
      <rect x="3" y="12" width="5" height="5" fill="#7f7f7b" opacity=".8"/>
    </pattern>
    <pattern id="pl" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#4e9e2e"/>
      <rect x="0" y="0" width="12" height="12" fill="#5cae35"/>
      <rect x="12" y="12" width="12" height="12" fill="#5cae35"/>
      <rect x="0" y="0" width="6" height="6" fill="#6dbd3f" opacity=".8"/>
    </pattern>
  </defs>

  <!-- 太阳 -->
  <g fill="#ffe066" opacity=".95">
    <rect x="1046" y="30" width="70" height="70"/>
    <rect x="1036" y="42" width="90" height="46"/>
    <rect x="1058" y="20" width="46" height="90"/>
  </g>

  <!-- 云 -->
  <g fill="#ffffff" opacity=".9">
    <rect x="300" y="132" width="150" height="24"/>
    <rect x="330" y="110" width="84" height="26"/>
    <rect x="660" y="86" width="140" height="22"/>
    <rect x="684" y="66" width="76" height="22"/>
    <rect x="470" y="240" width="96" height="18"/>
  </g>

  <!-- 远山 -->
  <path d="M0,700 L0,620 L96,620 L96,596 L186,596 L186,572 L300,572 L300,600 L420,600
           L420,622 L556,622 L556,592 L700,592 L700,616 L842,616 L842,584 L962,584
           L962,608 L1082,608 L1082,592 L1200,592 L1200,700 Z"
        fill="#7fd050" opacity=".42"/>

  <!-- 左树 -->
  <g>
    <rect x="96" y="238" width="30" height="470" fill="#7a4d26"/>
    <rect x="103" y="238" width="10" height="470" fill="#8f5c2e"/>
    <rect x="20" y="112" width="184" height="94" fill="url(#pl)"/>
    <rect x="44" y="76" width="136" height="46" fill="#5cae35"/>
    <rect x="74" y="52" width="82" height="30" fill="#6dbd3f"/>
  </g>
  <!-- 右树 -->
  <g>
    <rect x="1084" y="222" width="28" height="486" fill="#7a4d26"/>
    <rect x="1091" y="222" width="9" height="486" fill="#8f5c2e"/>
    <rect x="1006" y="96" width="176" height="90" fill="url(#pl)"/>
    <rect x="1028" y="62" width="130" height="44" fill="#5cae35"/>
    <rect x="1056" y="40" width="76" height="28" fill="#6dbd3f"/>
