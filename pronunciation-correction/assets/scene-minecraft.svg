    <rect x="760" y="708" width="32" height="28"/>
    <rect x="972" y="700" width="26" height="24"/>
    <rect x="150" y="712" width="24" height="22"/>
  </g>

  <!-- 花 -->
  <g>
    <rect x="418" y="682" width="4" height="18" fill="#4c8f2a"/>
    <rect x="410" y="672" width="18" height="11" fill="#e8462f"/>
    <rect x="640" y="688" width="4" height="14" fill="#4c8f2a"/>
    <rect x="632" y="678" width="16" height="11" fill="#f2c14e"/>
    <rect x="530" y="690" width="4" height="12" fill="#4c8f2a"/>
    <rect x="523" y="681" width="15" height="10" fill="#f6f2e6"/>
  </g>

  <!-- 漂浮方块 -->
  <g opacity=".55">
    <rect x="252" y="330" width="18" height="18" fill="#b9b9b3"/>
    <rect x="944" y="286" width="18" height="18" fill="#b9b9b3"/>
    <rect x="196" y="430" width="16" height="16" fill="#f2c14e"/>
    <rect x="990" y="396" width="16" height="16" fill="#f2c14e"/>
  </g>

  <!-- 粒子 -->
  <g fill="#ffffff" opacity=".5">
    <rect x="700" y="330" width="6" height="6"/>
    <rect x="430" y="392" width="5" height="5"/>
    <rect x="252" y="520" width="6" height="6"/>
    <rect x="930" y="470" width="5" height="5"/>
  </g>
</svg>
