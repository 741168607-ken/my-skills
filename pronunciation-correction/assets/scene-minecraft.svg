  <!-- 地面 -->
  <rect x="0" y="700" width="1200" height="44" fill="url(#pg)"/>
  <rect x="0" y="744" width="1200" height="76" fill="url(#pd)"/>
  <rect x="0" y="700" width="1200" height="5" fill="#9ae061" opacity=".85"/>

  <!-- 灌木 -->
  <g fill="#54a832">
